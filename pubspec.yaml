name: music_player
description: A Windows Desktop Music Player built with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.1.0
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Yekan Bakh FaNum
      fonts:
        - asset: assets/fonts/YekanBakhFaNum-Regular.ttf
          weight: 400
        - asset: assets/fonts/YekanBakhFaNum-Bold.ttf
          weight: 700
